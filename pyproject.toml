[project]
name = "ai-costs"
version = "2.2.3"
description = "What a block of AI-assisted work cost: real, API-only equivalent, vendor quote — from the usage already on disk"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quantum Media Technologies", email = "dev@qmediat.io" }]
keywords = ["llm", "cost", "tokens", "pricing", "claude", "codex", "gemini", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://www.qmediat.io/open-source"
Repository = "https://github.com/qmediat/ai-cost"
Issues = "https://github.com/qmediat/ai-cost/issues"
Changelog = "https://github.com/qmediat/ai-cost/blob/main/CHANGELOG.md"

[project.scripts]
ai-cost = "ai_cost.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_cost = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/ai_cost/tests"]

# Formatter / linter / type-checker settings — the same values as the private repository root, so the public
# repository's CI (`.github/workflows/ci.yml`) applies the standard the code was written to.

[tool.black]
line-length = 110
target-version = ["py39"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "C901", "PLR", "PLW", "RUF", "D"]
ignore = [
  "RUF001", "RUF002", "RUF003",     # typographic dashes and × in user-facing strings and docstrings are deliberate
  "D100", "D104", "D105", "D107",   # module / package / magic-method docstrings are optional
  "D203", "D213",                   # conflict with D211/D212
  "PLR2004",                        # magic-value comparisons are handled by named constants
  "E501",                           # line length is black's job
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-statements = 40
max-returns = 4

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "PLR"]   # test functions are named after the behaviour; a docstring would repeat the name

[tool.mypy]
python_version = "3.10"   # mypy ≥ 2.3 refuses 3.9 ("must be 3.10 or higher"); the 3.9 floor is guarded by ruff's py39 target and the CI job on 3.9
strict = true
warn_unreachable = true
pretty = true
