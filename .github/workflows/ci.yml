name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q src/ai_cost/tests
      - name: The shipped file runs its own tests offline
        run: |
          python scripts/build.py src dist/ai-cost
          dist/ai-cost selftest

  shape:
    name: Format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # The same versions as the private gate the code was written against; Dependabot does not track pip
      # installs in workflows, so bump these together with that gate.
      - run: python -m pip install --upgrade pip ruff==0.16.8 black==26.5.1 mypy==2.3.1
      - run: ruff check src
      - run: black --check src
      - run: mypy --strict src/ai_cost
